name: Update Folder Tree in README

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install tree command
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Generate folder structure
        run: tree -I ".git|node_modules|vendor|__pycache__" > repo_tree.txt

      - name: Update README
        run: |
          START="<!-- TREE START -->"
          END="<!-- TREE END -->"
          TREE_CONTENT="$(printf '```\n%s\n```' "$(cat repo_tree.txt)")"

          awk -v start="$START" -v end="$END" -v new="$TREE_CONTENT" '
            $0 ~ start { print; print new; skip=1; next }
            $0 ~ end { skip=0 }
            skip==0 { print }
          ' README.md > README.new

          mv README.new README.md

      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add README.md
          git commit -m "Auto-update folder structure" || echo "No changes to commit"
          git push