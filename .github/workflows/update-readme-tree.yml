name: Update Folder Tree in README

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install tree command
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Generate folder structure
        run: |
          tree -I ".git|node_modules|vendor|__pycache__" > repo_tree.txt

      - name: Update README.md
        run: |
          START="<!-- TREE START -->"
          END="<!-- TREE END -->"
          TREE_CONTENT=$(sed 's/[&/\]/\\&/g' repo_tree.txt)

          awk -v start="$START" -v end="$END" -v content="```\\n$TREE_CONTENT\\n```" '
          $0==start {print; print content; found=1; next}
          $0==end {found=0}
          !found {print}
          $0==end {print}
          ' README.md > README_new.md

          mv README_new.md README.md

      - name: Commit changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add README.md
          git commit -m "Auto-update folder structure" || echo "No changes"
          git push
